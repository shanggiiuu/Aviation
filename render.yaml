# Render Blueprint: AeroLearn as a static site (no API server or database).
# Progress, profiles, community posts and the shop are stored in each visitor's browser.
services:
  - type: web
    runtime: static
    name: aerolearn
    buildCommand: npm ci && npm run build:static
    staticPublishPath: apps/web/dist
    routes:
      # React Router handles /dashboard, /shop, … so every unknown path serves the app
      - type: rewrite
        source: /*
        destination: /index.html
