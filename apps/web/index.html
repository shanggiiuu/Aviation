<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroLearn — Understand the skies. One lesson at a time.</title>
<meta name="description" content="A beginner-friendly aviation learning platform with lessons, missions, a dictionary, live weather and a rewards shop.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<script>/* apply saved/system theme before first paint (same key as the classic site) */
(function () { var t; try { t = JSON.parse(localStorage.getItem("sky_theme")); } catch (e) {}
  if (t !== "night" && t !== "day") t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
  document.documentElement.dataset.theme = t; })();</script>
</head>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
